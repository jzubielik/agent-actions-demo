components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Item:
      properties:
        quantity:
          exclusiveMinimum: 0.0
          maximum: 10000.0
          title: Quantity
          type: integer
        sku:
          maxLength: 64
          minLength: 1
          title: Sku
          type: string
        unit_price_minor:
          description: Price of one unit, in the minor unit of the currency
          maximum: 100000000.0
          minimum: 0.0
          title: Unit Price Minor
          type: integer
      required:
      - sku
      - quantity
      - unit_price_minor
      title: Item
      type: object
    NewOrder:
      properties:
        currency:
          description: ISO 4217 code
          pattern: ^[A-Z]{3}$
          title: Currency
          type: string
        customer_id:
          maxLength: 64
          minLength: 1
          title: Customer Id
          type: string
        discount_code:
          anyOf:
          - maxLength: 32
            type: string
          - type: 'null'
          title: Discount Code
        items:
          items:
            $ref: '#/components/schemas/Item'
          maxItems: 200
          minItems: 1
          title: Items
          type: array
      required:
      - customer_id
      - currency
      - items
      title: NewOrder
      type: object
    Order:
      properties:
        created_at:
          description: UTC, ISO 8601
          title: Created At
          type: string
        currency:
          title: Currency
          type: string
        customer_id:
          title: Customer Id
          type: string
        discount_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Discount Code
        discount_minor:
          title: Discount Minor
          type: integer
        id:
          title: Id
          type: string
        items:
          items:
            $ref: '#/components/schemas/Item'
          title: Items
          type: array
        status:
          $ref: '#/components/schemas/Status'
        subtotal_minor:
          title: Subtotal Minor
          type: integer
        total_minor:
          title: Total Minor
          type: integer
      required:
      - id
      - customer_id
      - currency
      - status
      - items
      - discount_code
      - subtotal_minor
      - discount_minor
      - total_minor
      - created_at
      title: Order
      type: object
    Problem:
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
      title: Problem
      type: object
    Status:
      enum:
      - draft
      - placed
      - paid
      - cancelled
      title: Status
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: Orders
  version: 1.0.0
openapi: 3.1.0
paths:
  /orders:
    get:
      operationId: list_orders_orders_get
      parameters:
      - in: query
        name: customer_id
        required: true
        schema:
          maxLength: 64
          minLength: 1
          title: Customer Id
          type: string
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
          title: Status
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Order'
                title: Response List Orders Orders Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Orders
    post:
      operationId: create_order_orders_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The order is not valid or its discount code is unknown
      summary: Create Order
  /orders/{order_id}:
    get:
      operationId: get_order_orders__order_id__get
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No order with this id
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Order
  /orders/{order_id}/cancel:
    post:
      description: Cancels an order that is not paid yet. A paid order is refunded,
        not cancelled.
      operationId: cancel_order_orders__order_id__cancel_post
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No order with this id
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The status of the order does not allow this
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Cancel Order
  /orders/{order_id}/pay:
    post:
      operationId: pay_order_orders__order_id__pay_post
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No order with this id
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The status of the order does not allow this
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Pay Order
  /orders/{order_id}/place:
    post:
      operationId: place_order_orders__order_id__place_post
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          title: Order Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No order with this id
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The status of the order does not allow this
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Place Order
