name: AI agent
permissions: {}
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  agent:
    uses: jzubielik/agent-actions/.github/workflows/agent.yml@v1.0.1
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      AGENT_ACTIONS_READ_TOKEN: ${{ secrets.AGENT_ACTIONS_READ_TOKEN }}
      # To push the agent's commit: a GitHub App.
      AGENT_ACTIONS_CLIENT_ID: ${{ secrets.AGENT_ACTIONS_CLIENT_ID }}
      AGENT_ACTIONS_APP_KEY: ${{ secrets.AGENT_ACTIONS_APP_KEY }}
