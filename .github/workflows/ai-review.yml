name: AI review
permissions: {}
on:
  pull_request:
    types: [labeled, unlabeled]
jobs:
  review:
    uses: jzubielik/agent-actions/.github/workflows/review.yml@v1.0.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      actions: read
      id-token: write
    secrets:
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
      AGENT_ACTIONS_READ_TOKEN: ${{ secrets.AGENT_ACTIONS_READ_TOKEN }}
